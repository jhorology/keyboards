# SPDX-License-Identifier: MIT

description: Sonix SNLED27351 I2C RGB LED matrix driver

compatible: "sonix,snled27351"

include: i2c-device.yaml

properties:
  chain-length:
    type: int
    required: true
    description: Number of logical RGB pixels

  pixel-channels:
    type: uint8-array
    required: true
    description: |
      Flat PWM register map. Three bytes per pixel in chain-length order:
      red channel address, green channel address, blue channel address.

  reg:
    required: true
    description: 7-bit I2C address (Keychron Q60 uses 0x74)
